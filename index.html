<!DOCTYPE html>
<meta
  name="viewport"
  content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
/>

<body
  style="
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0px;
    overflow: hidden;
  "
>
  <style>
    #buttonRight {
      position: absolute;
      bottom: 60px;
      right: 20px;
      z-index: 10;
      width: 48px;
      height: 48px;
      font-size: 20px;
      background-color: rgba(120, 59, 59, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
    #buttonLeft {
      position: absolute;
      bottom: 60px;
      right: 100px;
      z-index: 10;
      width: 48px;
      height: 48px;
      font-size: 20px;
      background-color: rgba(120, 59, 59, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
    #buttonUp {
      position: absolute;
      bottom: 100px;
      right: 60px;
      z-index: 10;
      width: 48px;
      height: 48px;
      font-size: 20px;
      background-color: rgba(120, 59, 59, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
    #buttonDown {
      position: absolute;
      bottom: 20px;
      right: 60px;
      z-index: 10;
      width: 48px;
      height: 48px;
      font-size: 20px;
      background-color: rgba(120, 59, 59, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    #buttonLeft:hover,
    #buttonRight:hover,
    #buttonUp:hover,
    #buttonDown:hover {
      background-color: rgba(57, 28, 28, 0.8);
    }
  </style>
  <button id="buttonRight">&rarr;</button>
  <button id="buttonLeft">&larr;</button>
  <button id="buttonUp">&uarr;</button>
  <button id="buttonDown">&darr;</button>
  <script src="/libs/ar-threex.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
