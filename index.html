<!DOCTYPE html>
<meta
  name="viewport"
  content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
/>

<body
  style="
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0px;
    overflow: hidden;
  "
>
  <button id="buttonRight">&rarr;</button>
  <button id="buttonLeft">&larr;</button>
  <button id="buttonUp">&uarr;</button>
  <button id="buttonDown">&darr;</button>
  <div id="overlayContainer">
    <img id="overlayImage" src="/assets/labyrinth_01.jpg" alt="Overlay" />
    <div id="textButtonContainer">
      <div id="overlayText">Current Image: labyrinth_01.jpg</div>

      <label for="fileInput" id="fileButton">Choose New Image</label>
      <input type="file" id="fileInput" accept=".jpg,.jpeg" />

      <label id="takePhotoButton">Take Photo</label>

      <video id="webcam" autoplay playsinline></video>
      <button id="captureButton">Capture</button>
    </div>
  </div>

  <canvas id="snapshotCanvas" style="display: none"></canvas>
  <script src="/libs/ar-threex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
